<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    
    <title>{% block title %}IEEE AAU - IEEE Amman Arab University Student Branch | Jordan{% endblock %}</title>
    <meta name="description" content="IEEE AAU - Official IEEE Student Branch at Amman Arab University in Jordan. Join our student community to develop technical skills, participate in events, workshops, and competitions in electrical engineering, electronics, and computing.">
    <meta name="keywords" content="IEEE, IEEE AAU, Amman Arab University, AAU Jordan, IEEE Student Branch, electrical engineering, electronics, computer engineering, technology, student activities, Jordan universities, technical events">
    <meta name="author" content="IEEE AAU Student Branch">
    <meta name="robots" content="index, follow">
    <meta name="geo.region" content="JO">
    <meta name="geo.placename" content="Amman">
    
    
    <meta property="og:title" content="IEEE AAU - IEEE Student Branch at Amman Arab University, Jordan">
    <meta property="og:description" content="Join IEEE AAU Student Branch at Amman Arab University for technical workshops, competitions, and professional development opportunities in Jordan.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_JO">
    
    
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "IEEE AAU Student Branch",
      "alternateName": "IEEE Amman Arab University",
      "url": "https://ieee-aau.edu.jo",
      "logo": "https://www.ieee.org/content/dam/ieee-org/ieee/web/org/about/ieee-logo.jpg",
      "description": "IEEE Student Branch at Amman Arab University in Jordan - fostering technical innovation and professional development among students",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Amman Arab University",
        "addressLocality": "Amman",
        "addressCountry": "JO"
      },
      
    }
    </script>

    <style>
        :root{
          --bg:#f8f9fa;
          --bg-2:#e9ecef;
          --panel:#ffffff;
          --card:#00629B;
          --muted:#6c757d;
          --txt:#212529;
          --stroke:#dee2e6;
          --ring: 0 0 0 0.125rem rgba(0, 98, 155, 0.25), 0 0.625rem 1.875rem rgba(0,0,0,0.1);
          --brand-1:#00629B;
          --brand-2:#00A8E0;
          --radius: 0.5rem;
        }

        *{box-sizing:border-box}
        html,body{height:100%}
        body{
          margin:0;
          font-family: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
          color:var(--txt);
          background: var(--bg);
          overflow-x:hidden;
          padding: 0;
          font-size: 16px;
        }

        .container{
            max-width: 90%;
            margin: 0 auto;
            padding: 1.75rem 1rem;
        }
        
        .header{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:0.75rem;
          margin-bottom:1.125rem;
          border-bottom: 1px solid var(--stroke);
          padding-bottom: 1.25rem;
          flex-wrap: wrap;
        }
        
        .brand{
            display:flex;
            align-items:center;
            gap:0.75rem;
            flex-wrap: wrap;
        }
        
        .logo {
          width: 3.125rem;
          height: 3.125rem;
          min-width: 3.125rem;
          background: url('https://www.ieee.org/content/dam/ieee-org/ieee/web/org/about/ieee-logo.jpg') center/contain no-repeat;
        }
        
        .name{
            font-weight:800;
            letter-spacing:.0125rem;
            font-size:1.2rem;
            color: var(--brand-1);
        }
        
        .location-badge {
          background: var(--brand-2);
          color: white;
          padding: 0.25rem 0.75rem;
          border-radius: 1rem;
          font-size: 0.75rem;
          font-weight: 600;
          margin-left: 0.5rem;
        }
        
        .toolbar{
            display:flex;
            align-items:center;
            gap:0.625rem;
            flex-wrap: wrap;
        }
        
        .btn{
          appearance:none;
          border:0;
          border-radius:var(--radius);
          padding:0.625rem 0.875rem;
          font-weight:700;
          cursor:pointer;
          background:var(--brand-1);
          color:white;
          text-decoration:none;
          display:inline-block;
          text-align:center;
          transition: all 0.2s ease;
          font-size:0.875rem;
          white-space: nowrap;
        }
        
        .btn:hover{
            transform:translateY(-0.0625rem);
            box-shadow:var(--ring)
        }
        
        .btn.acc{
            background:linear-gradient(135deg,var(--brand-1),var(--brand-2));
            color:white;
            box-shadow:var(--ring)
        }
        
        .btn.ghost{
            background:transparent;
            border:1px solid var(--brand-1);
            color: var(--brand-1);
        }
    
        
        .btn.danger{background:#dc3545;color:white}
        .btn.success{background:#28a745;color:white}
        .btn.warning{background:#ffc107;color:#000}

        .hero{
          background:linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%);
          border-radius:var(--radius);
          padding:1.75rem 1.25rem;
          margin:0.625rem 0 1.25rem;
          color: white;
        }
        
        .hero h1{
            margin:0 0 0.75rem;
            font-size:clamp(1.5rem, 4vw, 2.2rem);
        }
        
        .hero p{
            margin:0;
            color:rgba(255,255,255,0.9);
            font-size:clamp(0.9rem, 2.5vw, 1.1rem);
            line-height:1.6
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
            gap:1.25rem;
        }

        .card{
          position:relative;
          background:var(--panel);
          border:1px solid var(--stroke);
          border-radius:var(--radius);
          padding:1.25rem;
          min-height:13.75rem;
          overflow:hidden;
          transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
          display:flex;
          flex-direction:column;
          cursor: pointer;
          text-decoration: none;
          color: inherit;
        }
        
        .card:hover{
            transform:translateY(-0.25rem);
            box-shadow:0 1rem 2.5rem rgba(0,0,0,.1);
            border-color:var(--brand-1)
        }
        
        .card .tag{
            font-size:0.75rem;
            opacity:.8;
            padding:0.375rem 0.75rem;
            border-radius:999px;
            background:var(--brand-1);
            color:white;
            border:1px solid var(--stroke);
            display:inline-block
        }
        
        .card h3{
            margin:0.75rem 0 0.5rem;
            font-size:1.3rem;
            color: var(--brand-1);
        }
        
        .card p{
            margin:0 0 1rem;
            color:var(--muted);
            line-height:1.6;
            flex-grow:1
        }
        
        .card .footer{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:0.5rem;
            margin-top:auto
        }

        .form-group{margin-bottom:1.25rem}
        .form-group label{
            display:block;
            margin-bottom:0.5rem;
            font-weight:600;
            color:var(--txt)
        }
        
        .input, textarea{
          width:100%;
          background:var(--panel);
          color:var(--txt);
          border:1px solid var(--stroke);
          border-radius:var(--radius);
          padding:0.75rem 1rem;
          font:inherit;
          outline:none;
          transition:all 0.2s ease;
        }
        
        .input:focus, textarea:focus{
            border-color:var(--brand-2);
            box-shadow:0 0 0 0.125rem rgba(0, 168, 224, 0.25)
        }
        
        textarea{
            min-height:7.5rem;
            resize:vertical
        }

        .error{color:#dc3545;font-size:0.875rem;margin-top:0.375rem}
        .success{color:#28a745;font-size:0.875rem;margin-top:0.375rem}
        .message{
          padding:0.75rem 1rem;
          border-radius:var(--radius);
          margin-bottom:1.25rem;
          border:1px solid;
        }
        
        .message.error{
            background:rgba(220,53,69,.1);
            border-color:rgba(220,53,69,.3);
            color:#dc3545
        }
        
        .message.success{
            background:rgba(40,167,69,.1);
            border-color:rgba(40,167,69,.3);
            color:#28a745
        }

        .actions{
            display:flex;
            gap:0.75rem;
            align-items:center;
            flex-wrap:wrap
        }
        
        .row{
            display:flex;
            gap:0.75rem;
            flex-wrap: wrap;
        }
        
        .row>*{flex:1; min-width: 200px;}

        .footer-note{
            margin-top:2.5rem;
            color:#6c757d;
            font-size:0.75rem;
            text-align:center;
            opacity:.9
        }

        .post-content{
            line-height:1.8;
            font-size:1.1rem;
            color:var(--muted);
            margin-bottom:1.5rem
        }
        
        .post-meta{
            color:var(--muted);
            font-size:0.875rem;
            margin-bottom:1rem
        }
        
        .post-image{
            width:100%;
            border-radius:var(--radius);
            margin-bottom:1.5rem;
            max-height:25rem;
            object-fit:cover
        }
        
        .society-card {
          display: block;
          text-decoration: none;
          color: inherit;
        }
        
        .society-card:hover {
          text-decoration: none;
          color: inherit;
        }
        
        .breadcrumb {
          margin-bottom: 1.5rem;
          font-size: 0.875rem;
          color: var(--muted);
        }
        
        .breadcrumb a {
          color: var(--brand-1);
          text-decoration: none;
        }
        
        .breadcrumb a:hover {
          text-decoration: underline;
        }

        
        @media (max-width: 768px) {
            .container {
                max-width: 95%;
                padding: 1rem 0.5rem;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .toolbar {
                width: 100%;
                justify-content: flex-start;
            }
            
            .grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .hero {
                padding: 1.5rem 1rem;
                margin: 0.5rem 0 1rem;
            }
            
            .card {
                min-height: auto;
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                font-size: 14px;
            }
            
            .container {
                max-width: 100%;
                padding: 0.75rem 0.5rem;
            }
            
            .btn {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
            }
            
            .hero h1 {
                font-size: 1.3rem;
            }
            
            .hero p {
                font-size: 0.85rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="brand">
                <div class="logo"></div>
                <div class="name">
                    IEEE AAU
                    <span class="location-badge">Jordan</span>
                </div>
            </div>
            <div class="toolbar">
                
                    <a href="{% url 'home' %}" class="btn ghost">Home</a>
            
            </div>
        </header>

        
       

        {% block content %}{% endblock %}

        <div class="footer-note">
            IEEE AAU Student Branch at Amman Arab University, Jordan &copy; 2025 - All rights reserved
        </div>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
