{% extends 'base.html' %}

{% block title %}Delete Post - {{ society.name }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto;">
    <div class="card" style="border-color: #dc3545; background: rgba(220,53,69,.05); text-align: center;">
        <h1 style="color: #dc3545; margin-bottom: 16px;"> Delete Post</h1>
        <p style="margin-bottom: 24px; font-size: 1.1em;">Are you sure you want to delete this post?</p>
        
        <div style="background: var(--panel); padding: 20px; border-radius: 12px; margin: 20px 0;">
            <h3 style="margin: 0 0 12px 0;">{{ post.title }}</h3>
            <p style="color: var(--muted); margin: 0 0 16px 0;">{{ post.content|truncatewords:30 }}</p>
            {% if post.img %}
                <img src="{{ post.img.url }}" alt="{{ post.title }}" style="max-width: 200px; border-radius: 8px;">
            {% endif %}
        </div>
        
        <form method="POST" style="margin-top: 24px;">
            {% csrf_token %}
            <div class="actions" style="justify-content: center;">
                <button type="submit" class="btn danger">Yes, Delete</button>
                <a href="{% url 'society_dashboard' society.name %}" class="btn ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
